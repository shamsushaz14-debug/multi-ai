/* Fast API Worker Call with Instant User Abort Tracking */
async function callWorker(modelId, messages, timeoutMs = 26000, temp = 0.25, maxTokens = 650, externalSignal = null) {
  const ctrl = new AbortController();
  activeFetchControllers.add(ctrl);
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  const onExternalAbort = () => ctrl.abort();

  if (externalSignal) {
    if (externalSignal.aborted) {
      clearTimeout(timer);
      activeFetchControllers.delete(ctrl);
      const err = new Error("ABORTED_BY_USER");
      err.isUserAbort = true;
      throw err;
    }
    externalSignal.addEventListener("abort", onExternalAbort, { once: true });
  }

  try {
    const headers = { "Content-Type": "application/json" };
    if (state.pin) headers["X-App-Pin"] = state.pin;

    const res = await fetch(state.workerUrl, {
      method: "POST",
      headers,
      body: JSON.stringify({
        model: modelId,
        messages,
        temperature: temp,
        top_p: 0.85,
        max_tokens: maxTokens
      }),
      signal: ctrl.signal
    });
    const textRaw = await res.text();
    let data = {};
    try { data = JSON.parse(textRaw); } catch (e) { data = { error: textRaw || `HTTP ${res.status}` }; }

    if (!res.ok) {
      const errMsg = typeof data.error === "string"
        ? data.error
        : (data.error && data.error.message ? data.error.message : `Error ${res.status}`);
      throw new Error(res.status === 401 ? `401 Unauthorized: ${errMsg}` : errMsg);
    }
    const text = cleanMalayalamText(data.content || "");
    if (!text) throw new Error("ശൂന്യമായ ഉത്തരം ലഭിച്ചു");
    markModelHealthy(modelId);
    return text;
  } catch (err) {
    if (externalSignal && externalSignal.aborted) {
      const abortErr = new Error("ABORTED_BY_USER");
      abortErr.isUserAbort = true;
      throw abortErr;
    }
    markModelFailed(modelId);
    if (err.name === "AbortError") throw new Error("സമയം കഴിഞ്ഞു (Timeout)");
    throw err;
  } finally {
    clearTimeout(timer);
    activeFetchControllers.delete(ctrl);
    if (externalSignal) externalSignal.removeEventListener("abort", onExternalAbort);
  }
}

/* Automatic Pure Malayalam Polisher (Runs ONLY on genuinely corrupted outputs) */
async function polishToPureMalayalam(question, rawAnswer, preferredModelId, externalSignal = null) {
  const polisher = getBestMalayalamPolisherModel();
  const candidates = [
    polisher ? polisher.id : "",
    preferredModelId || ""
  ].filter((id, i, arr) => id && arr.indexOf(id) === i);

  const sanitizedDraft = safeSanitizeMalayalam(rawAnswer);
  const prompt = [{
    role: "user",
    content: `താഴെയുള്ള ഉത്തരം അക്ഷരത്തെറ്റില്ലാത്ത ശുദ്ധവും ചുരുങ്ങിയതുമായ മലയാളത്തിലേക്ക് തിരുത്തി എഴുതുക. വസ്തുതകളും \`\`\` കോഡുകളും മാറ്റരുത്. ഉത്തരം മാത്രം നൽകുക.\n\nചോദ്യം: ${question}\n\nഉത്തരം:\n${sanitizedDraft}`
  }];

  const origScore = getMalayalamGlitchScore(rawAnswer);
  for (const cid of candidates) {
    if (externalSignal && externalSignal.aborted) break;
    try {
      const refined = await callWorker(cid, prompt, 24000, 0.15, 700, externalSignal);
      const cleaned = safeSanitizeMalayalam(refined);
      const newScore = getMalayalamGlitchScore(cleaned);
      if (cleaned && newScore <= origScore && !isMostlyEnglishInsteadOfMalayalam(cleaned)) {
        return { text: cleaned, polished: true, glitches: newScore };
      }
    } catch (e) {
      if (e && e.isUserAbort) break;
    }
  }

  return { text: sanitizedDraft, polished: false, glitches: getMalayalamGlitchScore(sanitizedDraft) };
}

const wait = (ms, signal = null) => new Promise((resolve) => {
  if (signal && signal.aborted) return resolve();
  const t = setTimeout(() => {
    if (signal) signal.removeEventListener("abort", onAbort);
    resolve();
  }, ms);
  const onAbort = () => {
    clearTimeout(t);
    resolve();
  };
  if (signal) signal.addEventListener("abort", onAbort, { once: true });
});

function buildTrimmedContext(recentTurns) {
  const msgs = [];
  recentTurns.forEach((t, idx) => {
    const isMostRecent = idx === recentTurns.length - 1;
    const maxReplyChars = isMostRecent ? 1200 : 550;
    const replyText = t.finalText.length > maxReplyChars
      ? t.finalText.slice(0, maxReplyChars) + "..."
      : t.finalText;
    msgs.push({ role: "user", content: t.question });
    msgs.push({ role: "assistant", content: replyText });
  });
  return msgs;
}

async function sendMessage() {
  if (state.isRunning) return;
  stopSpeaking();

  const input = document.getElementById("promptInput");
  const question = input.value.trim();
  const activeModels = state.models.filter(m => m.enabled);
  if (!question) return;
  if (activeModels.length === 0) return showToast("കുറഞ്ഞത് ഒരു മോഡലെങ്കിലും തിരഞ്ഞെടുക്കുക");

  const myRunToken = ++currentRunToken;
  chatRunAbortController = new AbortController();
  const runSignal = chatRunAbortController.signal;

  state.isRunning = true;
  input.value = "";
  input.style.height = "auto";
  updateSendButtonState();

  const session = getCurrentSession();
  if (session.turns.length === 0) session.title = question.slice(0, 48);

  const recentTurns = session.turns.filter(t => t.finalStatus === "done" && t.finalText).slice(-MAX_CONTEXT_TURNS);
  const baseMessages = buildTrimmedContext(recentTurns);
  const { routeInfo, orderedModels } = getOrderedModelsForQuestion(activeModels, question);
  baseMessages.push({ role: "user", content: buildPromptSuffix(question, routeInfo) });

  const turn = {
    id: Date.now(),
    question,
    finalStatus: "loading",
    finalBadge: "",
    finalText: "",
    finalError: "",
    finalRawError: "",
    answers: {}
  };
  orderedModels.forEach(m => {
    turn.answers[m.key] = {
      name: m.name,
      id: m.id,
      status: state.multiMode ? "loading" : "skipped",
      text: "",
      sec: ""
    };
  });
  session.turns.push(turn);

  const thread = document.getElementById("chatThread");
  thread.classList.add("has-turns");
  const welcome = thread.querySelector(".welcome-wrap");
  if (welcome) welcome.remove();
  document.getElementById("headerCenter").classList.add("visible");
  document.getElementById("headerTitle").textContent = session.title.slice(0, 24);
  thread.appendChild(buildTurnElement(turn, false));
  scrollToBottom();

  const reqTimeout = routeInfo.timeoutMs || 25000;
  const maxTokens = routeInfo.maxTokens || 650;
  const isAborted = () => myRunToken !== currentRunToken || runSignal.aborted;

  try {
    if (!state.multiMode) {
      /* FAST SINGLE-PASS SMART ROUTER */
      let bestAnswer = null;
      const errors = [];
      const totalStart = Date.now();
      let successfulTries = 0;

      for (const m of orderedModels) {
        if (isAborted()) return;
        const start = Date.now();
        const badgeEl = document.getElementById(`badge-${turn.id}-${m.key}`);
        const bodyEl = document.getElementById(`body-${turn.id}-${m.key}`);
        turn.answers[m.key].status = "loading";
        if (badgeEl) { badgeEl.className = "badge loading"; badgeEl.textContent = "..."; }
        if (bodyEl) { bodyEl.innerHTML = THINKING_HTML; }

        let reply = null;
        let lastErr = null;
        try {
          reply = await callWorker(m.id, baseMessages, reqTimeout, 0.25, maxTokens, runSignal);
        } catch (err) {
          if (err && err.isUserAbort) return;
          lastErr = err;
        }

        if (isAborted()) return;

        if (reply) {
          successfulTries++;
          const sec = ((Date.now() - start) / 1000).toFixed(1);
          const cleanBody = cleanMalayalamText(reply);
          const glitches = state.mlOnly ? getMalayalamGlitchScore(cleanBody) : 0;
          const tooEnglish = state.mlOnly && isMostlyEnglishInsteadOfMalayalam(cleanBody);
          const totalScore = glitches + (tooEnglish ? 25 : 0);

          turn.answers[m.key] = { ...turn.answers[m.key], status: "done", text: cleanBody, sec };
          if (badgeEl) {
            badgeEl.className = totalScore < 15 ? "badge done" : "badge loading";
            badgeEl.textContent = `${sec}s`;
          }
          if (bodyEl) { bodyEl.innerHTML = renderMarkdown(cleanBody); }

          if (!bestAnswer || totalScore < bestAnswer.totalScore) {
            bestAnswer = { text: cleanBody, glitches, totalScore, name: m.name, id: m.id, sec };
          }

          if (totalScore < 15 || successfulTries >= 2) break;
        } else if (lastErr) {
          errors.push(`${m.name}: ${lastErr.message}`);
          turn.answers[m.key] = { ...turn.answers[m.key], status: "fail", error: lastErr.message };
          if (badgeEl) { badgeEl.className = "badge fail"; badgeEl.textContent = "പരാജയം"; }
          if (bodyEl) { bodyEl.innerHTML = `<div style="color:var(--red);font-size:15px;">${escapeHtml(lastErr.message)}</div>`; }

          const lowErr = lastErr.message.toLowerCase();
          if (lowErr.includes("free-models-per-day") || lowErr.includes("401")) break;
        }
      }

      if (isAborted()) return;

      if (bestAnswer) {
        let finalText = cleanMalayalamText(bestAnswer.text);
        let polishedTag = "";

        if (state.mlOnly && state.autoPolish && bestAnswer.totalScore >= 15) {
          const polished = await polishToPureMalayalam(question, finalText, bestAnswer.id, runSignal);
          if (isAborted()) return;
          finalText = polished.text;
          if (polished.polished) polishedTag = " + ശുദ്ധമലയാളം";
        }

        if (state.mlOnly) {
          finalText = safeSanitizeMalayalam(finalText);
        }

        const totalSec = ((Date.now() - totalStart) / 1000).toFixed(1);
        turn.finalStatus = "done";
        turn.finalBadge = `${routeInfo.label} · ${bestAnswer.name}${polishedTag} · ${totalSec}s`;
        turn.finalText = finalText;
        updateTurnFinalUI(turn, true);
      } else {
        const diag = formatFriendlyError(errors);
        turn.finalStatus = "fail";
        turn.finalBadge = "പരാജയപ്പെട്ടു";
        turn.finalError = diag.title;
        turn.finalRawError = diag.raw;
        updateTurnFinalUI(turn, false);
      }
    } else {
      /* MULTI-AI SYNTHESIS MODE */
      const errors = [];
      const tasks = orderedModels.map(async (m, idx) => {
        if (idx > 0) await wait(idx * 120, runSignal);
        if (isAborted()) return;
        const start = Date.now();
        const badgeEl = document.getElementById(`badge-${turn.id}-${m.key}`);
        const bodyEl = document.getElementById(`body-${turn.id}-${m.key}`);
        try {
          const raw = await callWorker(m.id, baseMessages, reqTimeout, 0.25, maxTokens, runSignal);
          if (isAborted()) return;
          const reply = cleanMalayalamText(raw);
          const sec = ((Date.now() - start) / 1000).toFixed(1);
          turn.answers[m.key] = { ...turn.answers[m.key], status: "done", text: reply, sec };
          if (badgeEl) { badgeEl.className = "badge done"; badgeEl.textContent = `${sec}s`; }
          if (bodyEl) { bodyEl.innerHTML = renderMarkdown(reply); }
        } catch (err) {
          if ((err && err.isUserAbort) || isAborted()) return;
          errors.push(`${m.name}: ${err.message}`);
          turn.answers[m.key] = { ...turn.answers[m.key], status: "fail", error: err.message };
          if (badgeEl) { badgeEl.className = "badge fail"; badgeEl.textContent = "പരാജയം"; }
          if (bodyEl) { bodyEl.innerHTML = `<div style="color:var(--red);font-size:15px;">${escapeHtml(err.message)}</div>`; }
        }
      });

      await Promise.allSettled(tasks);
      if (isAborted()) return;

      const successList = Object.values(turn.answers).filter(a => a.status === "done");

      if (successList.length === 0) {
        const diag = formatFriendlyError(errors);
        turn.finalStatus = "fail";
        turn.finalBadge = "പരാജയപ്പെട്ടു";
        turn.finalError = diag.title;
        turn.finalRawError = diag.raw;
        updateTurnFinalUI(turn, false);
      } else {
        const polisher = getBestMalayalamPolisherModel();
        const sortedByPurity = [...successList].sort((a, b) => getMalayalamGlitchScore(a.text) - getMalayalamGlitchScore(b.text));
        const fallbackIds = [
          polisher ? polisher.id : "",
          state.synthModelId,
          ...sortedByPurity.map(s => s.id)
        ].filter((id, i, arr) => id && arr.indexOf(id) === i).slice(0, 2);

        if (successList.length === 1) {
          let singleText = cleanMalayalamText(successList[0].text);
          if (state.mlOnly && getMalayalamGlitchScore(singleText) >= 15) {
            const p = await polishToPureMalayalam(question, singleText, successList[0].id, runSignal);
            if (isAborted()) return;
            singleText = p.text;
          }
          turn.finalStatus = "done";
          turn.finalBadge = `${routeInfo.label} · ${successList[0].name}`;
          turn.finalText = state.mlOnly ? safeSanitizeMalayalam(singleText) : singleText;
        } else {
          const combined = successList.map(a => `### ${a.name}:\n${safeSanitizeMalayalam(a.text)}`).join("\n\n---\n\n");
          const synthPrompt = [{
            role: "user",
            content: `താഴെയുള്ള ഉത്തരങ്ങളിലെ ഏറ്റവും കൃത്യമായ വിവരങ്ങൾ ചേർത്ത് മിതമായ നീളത്തിൽ ഒരു ചുരുങ്ങിയ ഉത്തരം തയ്യാറാക്കുക. അവസാനം 1 വരിയിൽ **ചുരുക്കം:**, 1-2 ചെറിയ പോയിന്റിൽ **ടിപ്പുകൾ:** ചേർക്കുക.\n${state.mlOnly ? STRICT_ML_RULES : "Write clearly and concisely."}\n\nചോദ്യം: ${question}\n\nഉത്തരങ്ങൾ:\n${combined}`
          }];

          let bestResult = null;
          const startAll = Date.now();
          for (const candidateId of fallbackIds) {
            if (isAborted()) return;
            try {
              const reply = await callWorker(candidateId, synthPrompt, reqTimeout, 0.2, maxTokens, runSignal);
              if (isAborted()) return;
              const cleaned = state.mlOnly ? safeSanitizeMalayalam(reply) : cleanMalayalamText(reply);
              const glitches = state.mlOnly ? getMalayalamGlitchScore(cleaned) : 0;
              if (!bestResult || glitches < bestResult.glitches) {
                bestResult = { text: cleaned, glitches };
              }
              if (glitches < 15) break;
            } catch (err) {
              if (err && err.isUserAbort) return;
            }
          }

          if (isAborted()) return;

          if (bestResult) {
            const sec = ((Date.now() - startAll) / 1000).toFixed(1);
            turn.finalStatus = "done";
            turn.finalBadge = `${routeInfo.label} · ${successList.length} AI · ${sec}s`;
            turn.finalText = bestResult.text;
          } else {
            turn.finalStatus = "done";
            turn.finalBadge = `${routeInfo.label} · ${sortedByPurity[0].name}`;
            turn.finalText = state.mlOnly ? safeSanitizeMalayalam(sortedByPurity[0].text) : cleanMalayalamText(sortedByPurity[0].text);
          }
        }

        updateTurnFinalUI(turn, true);
      }
    }

    if (isAborted()) return;
    saveCurrentSession(session);
    scrollToBottom();
  } finally {
    if (myRunToken === currentRunToken) {
      chatRunAbortController = null;
      state.isRunning = false;
      updateSendButtonState();
    }
  }
}

/* Modals & Settings (Developer Only) */
function openQuickSheet() {
  if (!state.devMode) return;
  document.getElementById("autoRouteToggle").checked = state.autoRoute;
  document.getElementById("mlOnlyToggle").checked = state.mlOnly;
  document.getElementById("autoPolishToggle").checked = state.autoPolish;
  document.getElementById("multiModeToggle").checked = state.multiMode;
  renderModelControls();
  document.getElementById("quickSheet").style.display = "flex";
}

function openSettings() {
  if (!state.devMode) return;
  updateStaticAvatars();
  document.getElementById("setDevPin").value = state.devPin;
  document.getElementById("setWorkerUrl").value = state.workerUrl;
  document.getElementById("setWorkerPin").value = state.pin;
  renderModelSettings(state.models);
  document.getElementById("settingsModal").style.display = "flex";
}

function renderModelSettings(list) {
  document.getElementById("modelSettingsInputs").innerHTML = list.map((m, i) => `
    <label class="field-label">${escapeHtml(m.name)} (Model ID)</label>
    <input type="text" class="input-field" id="set-model-${i}" value="${escapeHtml(m.id)}" data-name="${escapeHtml(m.name)}" data-key="${escapeHtml(m.key)}">
  `).join("");
}

function applyPreset(type) { renderModelSettings(cloneObj(PRESETS[type])); }

function saveSettings() {
  const newDevPin = document.getElementById("setDevPin").value.trim();
  if (newDevPin) { state.devPin = newDevPin; localStorage.setItem("mai_dev_pin", newDevPin); }
  const newUrl = document.getElementById("setWorkerUrl").value.trim().replace(/\/$/, "");
  if (newUrl) { state.workerUrl = newUrl; localStorage.setItem("mai_worker", newUrl); }
  const newWorkerPin = document.getElementById("setWorkerPin").value.trim();
  state.pin = newWorkerPin;
  localStorage.setItem("mai_pin", newWorkerPin);

  state.models = state.models.map((m, i) => {
    const inp = document.getElementById(`set-model-${i}`);
    return { key: inp.dataset.key, name: inp.dataset.name, id: inp.value.trim(), enabled: m.enabled };
  });
  localStorage.setItem("mai_models_v3", JSON.stringify(state.models));
  modelCooldownUntil.clear();
  renderModelControls();
  if (getCurrentSession().turns.length === 0) renderChatThread();
  closeModal("settingsModal");
  showToast("സെറ്റിംഗ്സ് സേവ് ചെയ്തു");
}

function renderHistoryList() {
  const list = document.getElementById("historyList");
  list.innerHTML = state.sessions.length === 0
    ? `<p style="color:var(--muted);text-align:center;padding:24px;font-size:14px;">സേവ് ചെയ്ത ചാറ്റുകളൊന്നുമില്ല.</p>`
    : state.sessions.map(s => `
      <div class="history-item ${s.id === state.currentSessionId ? "active-chat" : ""}">
        <div class="history-main" onclick="loadSession('${s.id}')">
          <div class="history-q">${escapeHtml(s.title)}</div>
          <div class="history-meta">${escapeHtml(s.updatedAt)} • ${s.turns.length} ചോദ്യങ്ങൾ</div>
        </div>
        <button class="del-btn" onclick="deleteSession('${s.id}')">✕</button>
      </div>`).join("");
}

function loadSession(id) {
  if (state.isRunning || hasActiveThinkingUI()) stopGeneration();
  stopSpeaking();
  state.currentSessionId = id;
  renderChatThread();
  toggleDrawer(false);
}

function deleteSession(id) {
  state.sessions = state.sessions.filter(s => s.id !== id);
  localStorage.setItem("mai_sessions_v2", JSON.stringify(state.sessions));
  if (state.currentSessionId === id) {
    if (state.isRunning || hasActiveThinkingUI()) stopGeneration();
    stopSpeaking();
    createFreshSession();
    renderChatThread();
  }
  renderHistoryList();
}

function clearAllSessions() {
  if (!confirm("സേവ് ചെയ്ത എല്ലാ ചാറ്റുകളും മായ്ക്കണോ?")) return;
  if (state.isRunning || hasActiveThinkingUI()) stopGeneration();
  stopSpeaking();
  state.sessions = [];
  localStorage.removeItem("mai_sessions_v2");
  createFreshSession();
  renderChatThread();
  renderHistoryList();
}

function closeModal(id) { document.getElementById(id).style.display = "none"; }
function scrollToBottom() { const t = document.getElementById("chatThread"); requestAnimationFrame(() => { t.scrollTop = t.scrollHeight; }); }
function copyById(elId) { const el = document.getElementById(elId); if (el) navigator.clipboard.writeText(el.innerText).then(() => showToast("കോപ്പി ചെയ്തു!")); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 2200);
}

function escapeHtml(str) {
  return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderMarkdown(text) {
  if (!text) return "";
  const codeBlocks = [];
  let safe = escapeHtml(text);
  safe = safe.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push(`<pre><code>${code.trim()}</code></pre>`);
    return `@@CODEBLOCK_${idx}@@`;
  });
  safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
  safe = safe.replace(/^\s*---+\s*$/gim, "<hr>");
  safe = safe.replace(/^### (.*$)/gim, "<h4>$1</h4>");
  safe = safe.replace(/^## (.*$)/gim, "<h3>$1</h3>");
  safe = safe.replace(/^# (.*$)/gim, "<h3>$1</h3>");
  safe = safe.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  safe = safe.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  safe = safe.replace(/^\s*[-*]\s+(.*)$/gim, "<li>$1</li>");
  safe = safe.replace(/(<li>[\s\S]*?<\/li>)/g, "<ul>$1</ul>");
  safe = safe.replace(/<\/ul>\s*<ul>/g, "");
  safe = safe.replace(/\n/g, "<br>");
  safe = safe.replace(/<br>(<\/?(?:h3|h4|ul|li|hr)>)/g, "$1");
  safe = safe.replace(/(<\/(?:h3|h4|ul|li)>)<br>/g, "$1");
  codeBlocks.forEach((block, idx) => { safe = safe.replace(`@@CODEBLOCK_${idx}@@`, block); });
  return safe;
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
